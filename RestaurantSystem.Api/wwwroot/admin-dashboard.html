<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة الإدارة | نظام المطعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Sidebar -->
    <div class="flex h-screen">
        <div class="w-64 bg-gradient-to-b from-amber-900 to-amber-800 text-white p-6 overflow-y-auto">
            <div class="flex items-center gap-3 mb-8">
                <i class="fas fa-utensils text-2xl text-yellow-300"></i>
                <div>
                    <h1 class="text-xl font-bold">Restaurant</h1>
                    <p class="text-xs text-amber-200">نظام الإدارة</p>
                </div>
            </div>

            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-white/10 hover:bg-white/20 transition">
                    <i class="fas fa-chart-pie"></i>
                    <span>لوحة التحكم</span>
                </a>
                <a href="#orders" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fas fa-clipboard-list"></i>
                    <span>الطلبات</span>
                </a>
                <a href="#menu" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fas fa-utensils"></i>
                    <span>المنيو</span>
                </a>
                <a href="#users" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fas fa-users"></i>
                    <span>الموظفون</span>
                </a>
                <a href="#reports" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10 transition">
                    <i class="fas fa-chart-bar"></i>
                    <span>التقارير</span>
                </a>
            </nav>

            <div class="mt-auto pt-6 border-t border-white/20">
                <div class="flex items-center gap-3 p-3 rounded-lg bg-white/10">
                    <i class="fas fa-user-circle text-2xl"></i>
                    <div class="text-sm">
                        <p class="font-bold" id="userName">المدير</p>
                        <p class="text-xs text-amber-200">تسجيل الخروج</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-800">لوحة التحكم الرئيسية</h2>
                <div class="flex items-center gap-4">
                    <button class="px-4 py-2 rounded-lg bg-gray-100 hover:bg-gray-200 transition">
                        <i class="fas fa-bell"></i>
                    </button>
                    <button onclick="logout()" class="px-4 py-2 rounded-lg bg-red-100 text-red-600 hover:bg-red-200 transition">
                        <i class="fas fa-sign-out"></i>
                    </button>
                </div>
            </div>

            <!-- Content -->
            <div class="flex-1 overflow-y-auto p-8">
                <!-- Stats Cards -->
                <div class="grid grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-lg p-6 shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">إجمالي الطلبات</p>
                                <p class="text-3xl font-bold text-gray-800 mt-2" id="totalOrders">0</p>
                            </div>
                            <i class="fas fa-shopping-cart text-4xl text-blue-400/30"></i>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg p-6 shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">الإيرادات اليومية</p>
                                <p class="text-3xl font-bold text-gray-800 mt-2" id="dailyRevenue">0 ر.س</p>
                            </div>
                            <i class="fas fa-dollar-sign text-4xl text-green-400/30"></i>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg p-6 shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">العاملون</p>
                                <p class="text-3xl font-bold text-gray-800 mt-2" id="totalUsers">0</p>
                            </div>
                            <i class="fas fa-users text-4xl text-purple-400/30"></i>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg p-6 shadow">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-gray-500 text-sm">الطاولات المتاحة</p>
                                <p class="text-3xl font-bold text-gray-800 mt-2" id="availableTables">0</p>
                            </div>
                            <i class="fas fa-chair text-4xl text-yellow-400/30"></i>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div class="bg-white rounded-lg p-6 shadow">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">مبيعات اليوم</h3>
                        <canvas id="salesChart"></canvas>
                    </div>

                    <div class="bg-white rounded-lg p-6 shadow">
                        <h3 class="text-lg font-bold text-gray-800 mb-4">توزيع الفئات</h3>
                        <canvas id="categoriesChart"></canvas>
                    </div>
                </div>

                <!-- Recent Orders -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200">
                        <h3 class="text-lg font-bold text-gray-800">آخر الطلبات</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-right text-sm font-bold text-gray-700">رقم الطلب</th>
                                    <th class="px-6 py-3 text-right text-sm font-bold text-gray-700">الطاولة</th>
                                    <th class="px-6 py-3 text-right text-sm font-bold text-gray-700">المبلغ</th>
                                    <th class="px-6 py-3 text-right text-sm font-bold text-gray-700">الحالة</th>
                                    <th class="px-6 py-3 text-right text-sm font-bold text-gray-700">الوقت</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrders" class="divide-y divide-gray-200">
                                <tr>
                                    <td class="px-6 py-4 text-sm text-gray-600">جاري التحميل...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login.html';
        }

        async function fetchData() {
            try {
                const headers = { 'Authorization': `Bearer ${token}` };

                // Fetch Orders
                const ordersRes = await fetch(`${API_URL}/api/v1/Orders`, { headers });
                const ordersData = await ordersRes.json();
                document.getElementById('totalOrders').textContent = ordersData.data?.length || 0;

                // Fetch Tables
                const tablesRes = await fetch(`${API_URL}/api/v1/Tables`, { headers });
                const tablesData = await tablesRes.json();
                const available = tablesData.data?.filter(t => t.isAvailable)?.length || 0;
                document.getElementById('availableTables').textContent = available;

                // Fetch Users
                const usersRes = await fetch(`${API_URL}/api/v1/Users`, { headers });
                const usersData = await usersRes.json();
                document.getElementById('totalUsers').textContent = usersData.data?.length || 0;

                // Calculate revenue
                const totalRevenue = ordersData.data?.reduce((sum, order) => sum + (order.total || 0), 0) || 0;
                document.getElementById('dailyRevenue').textContent = totalRevenue.toFixed(2) + ' ر.س';

                // Display recent orders
                displayRecentOrders(ordersData.data?.slice(0, 5) || []);

                // Initialize charts
                initCharts();
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function displayRecentOrders(orders) {
            const tbody = document.getElementById('recentOrders');
            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td class="px-6 py-4 text-sm text-gray-600">${order.id?.substring(0, 8)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${order.tableId?.substring(0, 3)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${order.total?.toFixed(2)} ر.س</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${
                            order.status === 'Completed' ? 'bg-green-100 text-green-800' :
                            order.status === 'Preparing' ? 'bg-blue-100 text-blue-800' :
                            'bg-gray-100 text-gray-800'
                        }">
                            ${order.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${new Date(order.createdAt).toLocaleTimeString('ar')}</td>
                </tr>
            `).join('');
        }

        function initCharts() {
            const salesCtx = document.getElementById('salesChart')?.getContext('2d');
            if (salesCtx) {
                new Chart(salesCtx, {
                    type: 'line',
                    data: {
                        labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00'],
                        datasets: [{
                            label: 'المبيعات',
                            data: [100, 150, 120, 180, 200, 160, 140],
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } } }
                });
            }

            const categoriesCtx = document.getElementById('categoriesChart')?.getContext('2d');
            if (categoriesCtx) {
                new Chart(categoriesCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['المشروبات', 'الحلويات', 'الوجبات', 'الساندويتش'],
                        datasets: [{
                            data: [25, 20, 40, 15],
                            backgroundColor: ['#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4']
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Load data on page load
        fetchData();
    </script>
</body>
</html>
