<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طاولات المطعم</title>
    <style>
        :root {
            --primary: #2d3436;
            --accent: #0984e3;
            --bg: #f4f7f6;
            --available: #00b894;
            --occupied: #d63031;
            --reserved: #fdcb6e;
            --maintenance: #636e72;
            --muted: #636e72;
            --danger: #d63031;
            --success: #00b894;
            --border: #e5e7eb;
            --card: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 20px;
            color: var(--primary);
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 16px 24px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

            .header h2 {
                margin: 0 0 6px 0;
            }

            .header small {
                color: #dfe6e9;
            }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

            .header-btn:hover {
                background: rgba(255,255,255,0.08);
            }

        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
        }

        .side-panel {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

            .side-panel h3 {
                margin-top: 0;
                margin-bottom: 18px;
            }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        input, select {
            width: 100%;
            padding: 11px 12px;
            margin: 0 0 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            box-sizing: border-box;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 10px 12px;
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

            .checkbox-row input[type="checkbox"] {
                width: auto;
                margin: 0;
            }

        .btn-primary,
        .btn-secondary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-secondary {
            background: #636e72;
            color: white;
            margin-top: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

            .toolbar .filters {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                align-items: center;
            }

            .toolbar input,
            .toolbar select {
                min-width: 180px;
                margin: 0;
            }

        .summary {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .table-card {
            background: white;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.25s;
            position: relative;
            border-top: 8px solid var(--available);
        }

            .table-card:hover {
                transform: translateY(-4px);
            }

        .status-Available {
            border-top-color: var(--available);
        }

        .status-Occupied {
            border-top-color: var(--occupied);
        }

        .status-Reserved {
            border-top-color: var(--reserved);
        }

        .status-Maintenance {
            border-top-color: var(--maintenance);
        }

        .table-number {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--primary);
            margin: 4px 0;
        }

        .table-code {
            display: inline-block;
            background: #f1f5f9;
            color: #334155;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .table-info {
            color: var(--muted);
            font-size: 0.9em;
            margin-bottom: 10px;
            line-height: 1.7;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 6px;
        }

        .badge-Available {
            background: #e6f9f4;
            color: var(--available);
        }

        .badge-Occupied {
            background: #fdf2f2;
            color: var(--occupied);
        }

        .badge-Reserved {
            background: #fff9db;
            color: #f59f00;
        }

        .badge-Maintenance {
            background: #f1f3f5;
            color: var(--maintenance);
        }

        .flag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .flag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 8px;
            font-weight: 700;
        }

        .flag-ok {
            background: #e6f9f4;
            color: var(--success);
        }

        .flag-off {
            background: #fff1f2;
            color: var(--danger);
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            border-top: 1px solid #eee;
            padding-top: 12px;
            flex-wrap: wrap;
        }

        .btn-small {
            background: none;
            border: 1px solid #ddd;
            padding: 7px 9px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

            .btn-small:hover {
                background: #f8f9fa;
                transform: scale(1.05);
            }

        .btn-order {
            border-color: var(--available);
            color: var(--available);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            background: white;
            padding: 40px 20px;
            border-radius: 16px;
            color: var(--muted);
        }

        .page-message {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            display: none;
            font-weight: 700;
        }

            .page-message.success {
                background: #e6f9f4;
                color: var(--success);
                display: block;
            }

            .page-message.error {
                background: #fff1f2;
                color: var(--danger);
                display: block;
            }

        @media (max-width: 980px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .side-panel {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h2>🏢 إدارة طاولات المطعم</h2>
            <small>تحكم بحالة الطاولات، مواقعها، وروابط الـ QR الخاصة بها</small>
        </div>

        <div class="header-actions">
            <button class="header-btn" onclick="goToPage('Dashboard.html')">📊 الداشبورد</button>
            <button class="header-btn" onclick="goToPage('manage_menu.html')">🍽️ المنيو</button>
        </div>
    </div>

    <div id="pageMessage" class="page-message"></div>

    <div class="main-layout">
        <div class="side-panel">
            <h3 id="formTitle">➕ إضافة طاولة جديدة</h3>
            <input type="hidden" id="tableId">

            <label for="tableNum">رقم الطاولة</label>
            <input type="text" id="tableNum" placeholder="مثلاً: T10">

            <label for="tableCode">كود الطاولة (QR Code)</label>
            <input type="text" id="tableCode" placeholder="مثلاً: TBL-A01">

            <label for="capacity">السعة</label>
            <input type="number" id="capacity" placeholder="4">

            <label for="location">الموقع</label>
            <input type="text" id="location" placeholder="الحديقة، الطابق الثاني...">

            <label for="zone">المنطقة / Zone</label>
            <input type="text" id="zone" placeholder="Main Hall / VIP / Garden">

            <label for="floorNumber">رقم الطابق</label>
            <input type="number" id="floorNumber" placeholder="1">

            <div class="checkbox-row">
                <input type="checkbox" id="isActive" checked>
                <label for="isActive" style="margin:0;">الطاولة فعالة</label>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="isOrderingEnabled" checked>
                <label for="isOrderingEnabled" style="margin:0;">الطلب عبر QR مفعل</label>
            </div>

            <button class="btn-primary" id="saveBtn" onclick="saveTable()">حفظ بيانات الطاولة</button>
            <button class="btn-secondary" id="cancelBtn" style="display:none;" onclick="resetForm()">إلغاء</button>
        </div>

        <div>
            <div class="toolbar">
                <div class="summary" id="tablesSummary">جاري تحميل الطاولات...</div>

                <div class="filters">
                    <input type="text" id="searchInput" placeholder="بحث برقم أو كود أو موقع..." oninput="renderTables()">
                    <select id="statusFilter" onchange="renderTables()">
                        <option value="">كل الحالات</option>
                        <option value="Available">متاحة</option>
                        <option value="Occupied">مشغولة</option>
                        <option value="Reserved">محجوزة</option>
                        <option value="Maintenance">صيانة</option>
                    </select>
                </div>
            </div>

            <div class="tables-grid" id="tablesContainer">
                <div class="empty-state">جاري تحميل الطاولات...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem("authToken");
        let allTables = [];

        if (!token) {
            window.location.href = "login.html";
        }

        function authHeaders() {
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function showMessage(message, type = 'success') {
            const el = document.getElementById("pageMessage");
            el.className = `page-message ${type}`;
            el.textContent = message;

            setTimeout(() => {
                el.className = 'page-message';
                el.textContent = '';
            }, 3500);
        }

        async function loadTables() {
            try {
                const resp = await fetch(`${API_URL}/api/v1/Tables`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const res = await resp.json();

                if (!resp.ok || !res.success) {
                    throw new Error(res.message || 'فشل تحميل الطاولات');
                }

                allTables = Array.isArray(res.data) ? res.data : [];
                allTables.sort((a, b) => String(a.tableNumber).localeCompare(String(b.tableNumber), 'en'));
                renderTables();
            } catch (err) {
                console.error("Tables Load Error:", err);
                document.getElementById("tablesContainer").innerHTML =
                    `<div class="empty-state">تعذر تحميل الطاولات</div>`;
                document.getElementById("tablesSummary").innerText = "حدث خطأ أثناء التحميل";
            }
        }

        function renderTables() {
            const container = document.getElementById("tablesContainer");
            const searchValue = document.getElementById("searchInput").value.trim().toLowerCase();
            const statusFilter = document.getElementById("statusFilter").value;

            let filtered = [...allTables];

            if (searchValue) {
                filtered = filtered.filter(t =>
                    String(t.tableNumber || '').toLowerCase().includes(searchValue) ||
                    String(t.code || '').toLowerCase().includes(searchValue) ||
                    String(t.location || '').toLowerCase().includes(searchValue) ||
                    String(t.zone || '').toLowerCase().includes(searchValue)
                );
            }

            if (statusFilter) {
                filtered = filtered.filter(t => t.status === statusFilter);
            }

            document.getElementById("tablesSummary").innerText =
                `إجمالي المعروض: ${filtered.length} / ${allTables.length}`;

            if (!filtered.length) {
                container.innerHTML = `<div class="empty-state">لا توجد طاولات مطابقة</div>`;
                return;
            }

            container.innerHTML = filtered.map(buildTableCard).join('');
        }

        function buildTableCard(t) {
            const statusLabel = translateStatus(t.status);
            const qrUrl = buildPublicQrUrl(t.code);
            const activeOrdersCount = Number(t.activeOrdersCount || 0);

            return `
                    <div class="table-card status-${t.status}">
                        <div class="table-number">${escapeHtml(t.tableNumber)}</div>
                        <div class="table-code">${escapeHtml(t.code || 'NO-CODE')}</div>

                        <div class="table-info">
                            👥 السعة: ${t.capacity}<br>
                            📍 ${escapeHtml(t.location || 'غير محدد')}<br>
                            ${t.zone ? `🗂️ ${escapeHtml(t.zone)}<br>` : ''}
                            ${t.floorNumber !== null && t.floorNumber !== undefined ? `🏢 الطابق: ${t.floorNumber}<br>` : ''}
                            🔄 الطلبات النشطة: ${activeOrdersCount}
                        </div>

                        <span class="badge badge-${t.status}">
                            ${statusLabel}
                        </span>

                        <div class="flag-row">
                            <span class="flag ${t.isActive ? 'flag-ok' : 'flag-off'}">
                                ${t.isActive ? '✅ فعالة' : '⛔ غير فعالة'}
                            </span>

                            <span class="flag ${t.isOrderingEnabled ? 'flag-ok' : 'flag-off'}">
                                ${t.isOrderingEnabled ? '📲 QR مفعل' : '🚫 QR متوقف'}
                            </span>
                        </div>

                        <div class="actions">
                            <button class="btn-small btn-order" title="فتح طلب"
                                onclick="goToOrderPage('${t.id}', '${escapeJs(t.tableNumber)}')">🛒</button>

                            <button class="btn-small" title="نسخ رابط QR"
                                onclick="copyQrLink('${escapeJs(qrUrl)}')">🔗</button>

                            <button class="btn-small" title="تعديل"
                                onclick='editTable(${JSON.stringify(t).replace(/'/g, "&apos;")})'>📝</button>

                            <button class="btn-small" title="حذف"
                                onclick="deleteTable('${t.id}')">🗑️</button>
                        </div>
                    </div>
                `;
        }

        function buildPublicQrUrl(code) {
            if (!code) return '';
            return `${window.location.origin}/api/public/tables/by-code/${encodeURIComponent(code)}`;
        }

        function goToOrderPage(id, num) {
            window.location.href = `waiter_order.html?tableId=${id}&num=${encodeURIComponent(num)}`;
        }

        function copyQrLink(url) {
            if (!url) {
                showMessage("لا يوجد رابط QR للطاولة", "error");
                return;
            }

            navigator.clipboard.writeText(url)
                .then(() => showMessage("تم نسخ رابط QR للطاولة"))
                .catch(() => showMessage("تعذر نسخ الرابط", "error"));
        }

        async function saveTable() {
            const id = document.getElementById("tableId").value.trim();

            const data = {
                tableNumber: document.getElementById("tableNum").value.trim(),
                code: document.getElementById("tableCode").value.trim(),
                capacity: parseInt(document.getElementById("capacity").value),
                location: document.getElementById("location").value.trim(),
                zone: document.getElementById("zone").value.trim() || null,
                floorNumber: document.getElementById("floorNumber").value
                    ? parseInt(document.getElementById("floorNumber").value)
                    : null,
                isActive: document.getElementById("isActive").checked,
                isOrderingEnabled: document.getElementById("isOrderingEnabled").checked
            };

            if (!data.tableNumber || !data.code || !data.capacity || !data.location) {
                showMessage("رقم الطاولة والكود والسعة والموقع مطلوبة", "error");
                return;
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/api/v1/Tables/${id}` : `${API_URL}/api/v1/Tables`;

            if (id) {
                data.id = id;
            }

            try {
                const resp = await fetch(url, {
                    method,
                    headers: authHeaders(),
                    body: JSON.stringify(data)
                });

                const result = await resp.json();

                if (!resp.ok || !result.success) {
                    throw new Error(result.message || "فشل حفظ بيانات الطاولة");
                }

                showMessage(id ? "تم تحديث بيانات الطاولة بنجاح" : "تمت إضافة الطاولة بنجاح");
                resetForm();
                await loadTables();
            } catch (err) {
                console.error("Save Table Error:", err);
                showMessage(err.message || "خطأ في حفظ بيانات الطاولة", "error");
            }
        }

        function editTable(table) {
            document.getElementById("tableId").value = table.id || "";
            document.getElementById("tableNum").value = table.tableNumber || "";
            document.getElementById("tableCode").value = table.code || "";
            document.getElementById("capacity").value = table.capacity || "";
            document.getElementById("location").value = table.location || "";
            document.getElementById("zone").value = table.zone || "";
            document.getElementById("floorNumber").value =
                table.floorNumber !== null && table.floorNumber !== undefined ? table.floorNumber : "";
            document.getElementById("isActive").checked = !!table.isActive;
            document.getElementById("isOrderingEnabled").checked = !!table.isOrderingEnabled;

            document.getElementById("formTitle").innerText = "📝 تعديل الطاولة";
            document.getElementById("saveBtn").innerText = "تحديث بيانات الطاولة";
            document.getElementById("cancelBtn").style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById("tableId").value = "";
            document.getElementById("tableNum").value = "";
            document.getElementById("tableCode").value = "";
            document.getElementById("capacity").value = "";
            document.getElementById("location").value = "";
            document.getElementById("zone").value = "";
            document.getElementById("floorNumber").value = "";
            document.getElementById("isActive").checked = true;
            document.getElementById("isOrderingEnabled").checked = true;

            document.getElementById("formTitle").innerText = "➕ إضافة طاولة جديدة";
            document.getElementById("saveBtn").innerText = "حفظ بيانات الطاولة";
            document.getElementById("cancelBtn").style.display = "none";
        }

        async function deleteTable(id) {
            if (!confirm("هل أنت متأكد من حذف هذه الطاولة؟")) {
                return;
            }

            try {
                const resp = await fetch(`${API_URL}/api/v1/Tables/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const result = await resp.json();

                if (!resp.ok || !result.success) {
                    throw new Error(result.message || "فشل حذف الطاولة");
                }

                showMessage("تم حذف الطاولة بنجاح");
                await loadTables();
            } catch (err) {
                console.error("Delete Table Error:", err);
                showMessage(err.message || "تعذر حذف الطاولة", "error");
            }
        }

        function translateStatus(status) {
            const mapping = {
                "Available": "متاحة ✅",
                "Occupied": "مشغولة 🍽️",
                "Reserved": "محجوزة 📅",
                "Maintenance": "صيانة 🛠️"
            };
            return mapping[status] || status || "غير معروف";
        }

        function goToPage(page) {
            if (window.parent && window.parent !== window) {
                const frame = window.parent.document.getElementById('mainFrame');
                if (frame) {
                    frame.src = page;
                    return;
                }
            }
            window.location.href = page;
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function escapeJs(value) {
            return String(value ?? '')
                .replaceAll('\\', '\\\\')
                .replaceAll("'", "\\'")
                .replaceAll('"', '\\"');
        }

        setInterval(loadTables, 15000);
        loadTables();
    </script>
</body>
</html>
