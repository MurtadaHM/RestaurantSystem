<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إدارة المخزون | نظام المطعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gradient-to-b from-emerald-900 to-emerald-800 text-white p-6">
            <div class="flex items-center gap-3 mb-8">
                <i class="fas fa-boxes text-2xl text-green-300"></i>
                <h1 class="text-xl font-bold">إدارة المخزون</h1>
            </div>
            <nav class="space-y-2">
                <a href="#inventory" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-white/10">
                    <i class="fas fa-list"></i> المخزون
                </a>
                <a href="#categories" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/10">
                    <i class="fas fa-cube"></i> الفئات
                </a>
            </nav>
            <button onclick="logout()" class="w-full mt-auto text-left px-4 py-3 rounded-lg bg-red-500/20 hover:bg-red-500/30 transition">
                <i class="fas fa-sign-out ml-2"></i> تسجيل الخروج
            </button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-800">إدارة المخزون</h2>
                <button onclick="showAddItemModal()" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                    <i class="fas fa-plus ml-2"></i> إضافة عنصر
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-8">
                <!-- Alert for low stock -->
                <div class="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg flex items-center gap-3">
                    <i class="fas fa-exclamation-triangle text-yellow-600 text-xl"></i>
                    <div>
                        <p class="font-bold text-yellow-800">تنبيه المخزون المنخفض</p>
                        <p class="text-sm text-yellow-700">هناك <span id="lowStockCount">0</span> عناصر بمستويات مخزون منخفضة</p>
                    </div>
                </div>

                <!-- Inventory Table -->
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-6 py-4 text-right text-gray-700 font-bold">المنتج</th>
                                <th class="px-6 py-4 text-right text-gray-700 font-bold">الفئة</th>
                                <th class="px-6 py-4 text-right text-gray-700 font-bold">الكمية</th>
                                <th class="px-6 py-4 text-right text-gray-700 font-bold">الحد الأدنى</th>
                                <th class="px-6 py-4 text-right text-gray-700 font-bold">الحالة</th>
                                <th class="px-6 py-4 text-right text-gray-700 font-bold">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable" class="divide-y divide-gray-200">
                            <tr><td class="px-6 py-4 text-center" colspan="6">جاري التحميل...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="addItemModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-8 max-w-lg w-full">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">إضافة عنصر مخزون</h3>
            <form onsubmit="addInventoryItem(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">اسم المنتج</label>
                    <input type="text" id="itemName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">الكمية</label>
                        <input type="number" id="itemQuantity" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-bold mb-2">الحد الأدنى</label>
                        <input type="number" id="itemMinQuantity" required min="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">الفئة</label>
                    <select id="itemCategory" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="">اختر فئة</option>
                    </select>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">حفظ</button>
                    <button type="button" onclick="closeAddItemModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400 transition">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) window.location.href = '/login.html';

        async function loadInventory() {
            try {
                const response = await fetch(`${API_URL}/api/v1/Inventory`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                displayInventory(data.data || []);
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }

        function displayInventory(items) {
            const tbody = document.getElementById('inventoryTable');
            const lowStock = items.filter(i => i.quantity <= i.minQuantity).length;
            document.getElementById('lowStockCount').textContent = lowStock;

            tbody.innerHTML = items.map(item => `
                <tr>
                    <td class="px-6 py-4 font-bold text-gray-800">${item.name}</td>
                    <td class="px-6 py-4 text-gray-600">${item.category}</td>
                    <td class="px-6 py-4 text-gray-800">${item.quantity}</td>
                    <td class="px-6 py-4 text-gray-600">${item.minQuantity}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold ${
                            item.quantity > item.minQuantity 
                                ? 'bg-green-100 text-green-800' 
                                : 'bg-red-100 text-red-800'
                        }">
                            ${item.quantity > item.minQuantity ? 'كافي' : 'منخفض'}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <button onclick="editItem('${item.id}')" class="px-3 py-1 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">تعديل</button>
                    </td>
                </tr>
            `).join('');
        }

        function showAddItemModal() {
            document.getElementById('addItemModal').classList.remove('hidden');
        }

        function closeAddItemModal() {
            document.getElementById('addItemModal').classList.add('hidden');
        }

        async function addInventoryItem(event) {
            event.preventDefault();
            const name = document.getElementById('itemName').value;
            const quantity = parseInt(document.getElementById('itemQuantity').value);
            const minQuantity = parseInt(document.getElementById('itemMinQuantity').value);
            const category = document.getElementById('itemCategory').value;

            try {
                await fetch(`${API_URL}/api/v1/Inventory`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, quantity, minQuantity, category })
                });
                closeAddItemModal();
                document.getElementById('addItemModal').querySelector('form').reset();
                loadInventory();
            } catch (error) {
                alert('خطأ في إضافة العنصر');
            }
        }

        function editItem(id) {
            alert('سيتم تطوير ميزة التعديل قريباً');
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        loadInventory();
    </script>
</body>
</html>
