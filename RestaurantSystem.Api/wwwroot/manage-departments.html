<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>إدارة الأقسام | نظام المطعم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-gradient-to-b from-amber-900 to-amber-800 text-white p-6">
            <div class="flex items-center gap-3 mb-8">
                <i class="fas fa-building text-2xl text-yellow-300"></i>
                <h1 class="text-xl font-bold">إدارة الأقسام</h1>
            </div>
            <button onclick="logout()" class="w-full mt-auto text-left px-4 py-3 rounded-lg bg-red-500/20 hover:bg-red-500/30 transition">
                <i class="fas fa-sign-out ml-2"></i> تسجيل الخروج
            </button>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <div class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between">
                <h2 class="text-2xl font-bold text-gray-800">إدارة الأقسام</h2>
                <button onclick="showAddDepartmentModal()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                    <i class="fas fa-plus ml-2"></i> إضافة قسم
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-8">
                <!-- Departments Grid -->
                <div id="departmentsGrid" class="grid grid-cols-3 gap-6">
                    <!-- Departments will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Add Department Modal -->
    <div id="addDepartmentModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">إضافة قسم جديد</h3>
            <form onsubmit="addDepartment(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">اسم القسم</label>
                    <input type="text" id="departmentName" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">الوصف</label>
                    <textarea id="departmentDescription" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" rows="3"></textarea>
                </div>
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
                        حفظ
                    </button>
                    <button type="button" onclick="closeAddDepartmentModal()" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400 transition">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin;
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = '/login.html';
        }

        async function loadDepartments() {
            try {
                const response = await fetch(`${API_URL}/api/v1/Departments`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                displayDepartments(data.data || []);
            } catch (error) {
                console.error('Error loading departments:', error);
            }
        }

        function displayDepartments(departments) {
            const grid = document.getElementById('departmentsGrid');
            grid.innerHTML = departments.map(dept => `
                <div class="bg-white rounded-lg shadow p-6 hover:shadow-lg transition">
                    <div class="flex items-center gap-4 mb-4">
                        <i class="fas fa-building text-4xl text-indigo-400/40"></i>
                        <h3 class="text-xl font-bold text-gray-800">${dept.name}</h3>
                    </div>
                    <p class="text-sm text-gray-600 mb-6">${dept.description || 'بدون وصف'}</p>
                    <div class="flex gap-2">
                        <button onclick="editDepartment('${dept.id}')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition text-sm">
                            تعديل
                        </button>
                        <button onclick="deleteDepartment('${dept.id}')" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition text-sm">
                            حذف
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function showAddDepartmentModal() {
            document.getElementById('addDepartmentModal').classList.remove('hidden');
        }

        function closeAddDepartmentModal() {
            document.getElementById('addDepartmentModal').classList.add('hidden');
        }

        async function addDepartment(event) {
            event.preventDefault();
            const name = document.getElementById('departmentName').value;
            const description = document.getElementById('departmentDescription').value;

            try {
                await fetch(`${API_URL}/api/v1/Departments`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, description })
                });
                closeAddDepartmentModal();
                document.getElementById('departmentName').value = '';
                document.getElementById('departmentDescription').value = '';
                loadDepartments();
            } catch (error) {
                alert('خطأ في إضافة القسم');
            }
        }

        function editDepartment(id) {
            alert('سيتم تطوير ميزة التعديل قريباً');
        }

        async function deleteDepartment(id) {
            if (!confirm('هل تريد حذف هذا القسم؟')) return;
            try {
                await fetch(`${API_URL}/api/v1/Departments/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadDepartments();
            } catch (error) {
                alert('خطأ في حذف القسم');
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        loadDepartments();
    </script>
</body>
</html>
