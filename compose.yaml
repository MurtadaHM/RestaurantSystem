version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: restaurant_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-RestaurantDb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - restaurant_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  restaurantsystemapi:
    image: restaurantsystem:latest
    container_name: restaurant_api
    build:
      context: .
      dockerfile: RestaurantSystem.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5183}:5183"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-RestaurantDb}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_KEY: ${JWT_KEY}
      JWT_ISSUER: ${JWT_ISSUER:-RestaurantSystem}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-RestaurantSystemUsers}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-haiku-20240307}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-https://api.anthropic.com/v1/}
      SENDY_BASE_URL: ${SENDY_BASE_URL}
      SENDY_API_KEY: ${SENDY_API_KEY}
      SENDY_WEBHOOK_SECRET: ${SENDY_WEBHOOK_SECRET}
      TEAM6_ENABLED: ${TEAM6_ENABLED:-true}
      TEAM6_BASE_URL: ${TEAM6_BASE_URL}
      TEAM6_RESTAURANT_ID: ${TEAM6_RESTAURANT_ID}
      TEAM6_POLLING_INTERVAL: ${TEAM6_POLLING_INTERVAL:-5}
      TEAM6_FALLBACK_USER_ID: ${TEAM6_FALLBACK_USER_ID}
      LOG_LEVEL: ${LOG_LEVEL:-Information}
      ASPNETCORE_ENVIRONMENT: Development
    networks:
      - restaurant_network

networks:
  restaurant_network:
    driver: bridge

volumes:
  postgres_data: